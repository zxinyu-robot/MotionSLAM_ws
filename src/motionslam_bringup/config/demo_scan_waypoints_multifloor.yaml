demo_scan_waypoints:
  ros__parameters:
    body_height: 0.35
    waypoints:
      # 一楼 → 门洞 → 坡道 → 二楼 → 巡回 → 原路返回
      # x/y 取栅格中心值（origin 0.0, res 0.20 → 中心 = k*0.2+0.1），避免 SnapFree 偏移超 max_goal_snap
      - {x: 1.5, y: 0.7, z: 0.35}
      - {x: 3.5, y: 1.3, z: 0.35}
      - {x: 5.5, y: 1.3, z: 0.85}
      - {x: 7.9, y: 1.3, z: 1.35}
      - {x: 10.1, y: 1.3, z: 1.35}
      - {x: 10.1, y: 2.9, z: 1.35}
      - {x: 8.1, y: 2.9, z: 1.35}
      - {x: 7.9, y: 1.3, z: 1.35}
      - {x: 5.5, y: 1.3, z: 0.85}
      - {x: 3.5, y: 1.3, z: 0.35}
      - {x: 0.7, y: 0.7, z: 0.35}
